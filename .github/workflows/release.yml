name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Prepare metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="QDock-v${VERSION}-mac-universal.dmg"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            PRERELEASE="true"
            NPM_TAG="next"
          else
            PRERELEASE="false"
            NPM_TAG="latest"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"

      - name: Build universal app
        run: ./scripts/build_universal_app.sh "${{ steps.meta.outputs.version }}"

      - name: Create DMG
        run: ./scripts/create_dmg.sh "${{ steps.meta.outputs.version }}"

      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 "${{ steps.meta.outputs.dmg_name }}" > checksums.txt

      - name: Publish installer to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd installer
          npm version --no-git-tag-version "${{ steps.meta.outputs.version }}"
          if [[ "${{ steps.meta.outputs.npm_tag }}" == "latest" ]]; then
            npm publish --access public
          else
            npm publish --access public --tag "${{ steps.meta.outputs.npm_tag }}"
          fi

      - name: Upload GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: |
            dist/${{ steps.meta.outputs.dmg_name }}
            dist/checksums.txt
